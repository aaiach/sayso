[project]
name = "sayso"
version = "0.0.1"
description = "Lets AI agents use your passwords, one-time codes and cards without ever seeing them: you approve each use from your phone."
requires-python = ">=3.11"
dependencies = ["playwright>=1.45", "qrcode>=7", "cryptography>=42", "mcp>=2", "keyring>=25"]

[project.scripts]
sayso-broker = "broker.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["broker*"]
