<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111614">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="sayso">
  <title>sayso</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon.png">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main>
    <h1>sayso</h1>
    <p id="status">Loading…</p>

    <section id="pair" class="hidden">
      <button id="pair-btn" class="primary hidden">Pair this phone</button>
      <button id="copy-btn" class="hidden">Copy pairing link</button>
      <button id="paste-btn" class="hidden">Paste pairing link</button>
    </section>

    <section id="card" class="card hidden" aria-live="assertive">
      <p class="label">Approve this?</p>
      <p class="item" id="r-item"></p>
      <p><span class="label">on</span> <strong id="r-site"></strong></p>
      <p class="small" id="r-frame"></p>
      <p class="small"><span class="label">kind</span> <span id="r-kind"></span></p>
      <p class="small mono" id="r-cert"></p>
      <ul class="warn" id="r-warn"></ul>
      <p class="small" id="r-time"></p>
      <div class="row">
        <button id="deny">Deny</button>
        <button id="approve" class="primary">Approve</button>
      </div>
    </section>

    <section id="paired" class="hidden">
      <p class="small">Paired with <strong id="p-broker"></strong> · key <span class="mono" id="p-fp"></span></p>
      <p class="small">Notifications: <span id="p-push"></span></p>
      <p class="small" id="p-seen"></p>
      <button id="unpair" class="link">Unpair this phone</button>
    </section>

    <p id="notice" class="small" aria-live="polite"></p>
    <p id="crypto" class="small"></p>
  </main>
</body>
</html>
